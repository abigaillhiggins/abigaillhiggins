# Builds metrics.languages.svg for the profile README with scripts/languages.py:
# the languages of every repository I own, collaborate on or am an organization
# member of (private ones included), weighted by my commits in each. Only
# aggregate percentages are rendered; no repository names or code leave the run.
#
# Needs a repository secret METRICS_TOKEN: a classic personal access token with
# the `repo` and `read:org` scopes, authorized for SSO on any organization that
# enforces it.
name: Metrics

on:
  schedule:
    - cron: "0 18 * * *" # daily, 04:00 in Canberra (AEST)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml, scripts/languages.py]

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  languages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Render languages chart
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GITHUB_LOGIN: ${{ github.repository_owner }}
        run: python3 -I scripts/languages.py metrics.languages.svg

      - name: Commit chart if it changed
        run: |
          git add metrics.languages.svg
          if git diff --cached --quiet; then
            echo "Chart unchanged"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: update languages chart"
          git push
